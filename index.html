<!doctype html>
<html lang="en" data-worldgame-state="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131a" />
    <title>WorldGame · Perlin World</title>
  </head>
  <body>
    <div id="app">
      <main class="game-shell" aria-label="WorldGame Perlin terrain viewer">
        <div id="game-container"></div>

        <div class="viewport-crosshair" aria-hidden="true">
          <span></span>
        </div>

        <section class="hud hud--primary" aria-label="World map status">
          <p class="eyebrow">WORLDGAME / TOPOGRAPHY</p>
          <div class="hud__row">
            <span>Zoom</span>
            <strong id="zoom-value">0.50×</strong>
            <span id="zoom-step">step 1 / 7</span>
          </div>
          <div class="hud__row hud__row--secondary">
            <span>Center</span>
            <strong id="center-value">960, 720</strong>
          </div>
        </section>

        <section class="hud hud--controls" aria-label="Map controls">
          <p><kbd>Wheel</kbd> step zoom</p>
          <p><kbd>Drag</kbd> or <kbd>WASD</kbd> pan</p>
          <p class="hud__hint">Zoom anchor · screen center</p>
        </section>

        <section class="terrain-legend" aria-label="Terrain legend">
          <span><i class="legend-swatch legend-swatch--water"></i>Water</span>
          <span><i class="legend-swatch legend-swatch--coast"></i>Coast</span>
          <span><i class="legend-swatch legend-swatch--land"></i>Land</span>
          <span><i class="legend-swatch legend-swatch--mountain"></i>Mountain</span>
          <span><i class="legend-swatch legend-swatch--snow"></i>Snow</span>
        </section>

        <output id="game-status" class="sr-only" aria-live="polite">Generating terrain</output>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
